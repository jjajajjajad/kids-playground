<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="아이놀이터">
<meta name="theme-color" content="#aee9ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>아이 놀이터</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
  html,body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
  body {
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:linear-gradient(180deg,#aee9ff 0%,#e6f9ff 45%,#fff6c9 100%);
    color:#3a3a55;
  }
  .screen { position:absolute; inset:0; display:none; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen.on { display:flex; }
  .body { flex:1; display:flex; flex-direction:column; min-height:0; position:relative; }

  /* ---------- 공통 상단바 ---------- */
  .bar { display:flex; align-items:center; gap:10px; padding:10px 14px; flex:0 0 auto; }
  .bar h2 { font-size:clamp(19px,3.4vw,28px); flex:1; text-shadow:0 2px 0 rgba(255,255,255,.7); white-space:nowrap; overflow:hidden; }
  .homeBtn {
    font-size:clamp(19px,3vw,25px); font-weight:800; border:none; cursor:pointer;
    background:#fff; color:#ff7b54; border-radius:999px; padding:9px 18px;
    box-shadow:0 5px 0 #ffd3c2; transition:transform .08s; flex:0 0 auto;
  }
  .homeBtn:active { transform:translateY(4px); box-shadow:0 1px 0 #ffd3c2; }
  .score {
    background:#fff; border-radius:999px; padding:8px 16px; font-size:clamp(17px,2.8vw,24px);
    font-weight:800; box-shadow:0 4px 0 rgba(0,0,0,.08); color:#4a7bd8; flex:0 0 auto; white-space:nowrap;
  }

  /* ---------- 홈 ---------- */
  #home { align-items:center; justify-content:flex-start; overflow-y:auto; }
  #home .title { text-align:center; padding:22px 10px 4px; }
  #home .title h1 { font-size:clamp(32px,6vw,56px); color:#ff7b54; text-shadow:0 3px 0 #fff; letter-spacing:2px; }
  #home .title p { font-size:clamp(14px,2.4vw,19px); color:#6b7aa1; margin-top:4px; }
  .menu {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:14px; padding:16px; width:100%; max-width:1000px;
  }
  .catHead {
    grid-column:1/-1; font-size:clamp(19px,3.2vw,27px); font-weight:900; color:#5a6ea6;
    padding:14px 4px 0; text-shadow:0 2px 0 #fff;
  }
  .card {
    background:#fff; border:none; cursor:pointer; border-radius:24px; padding:16px 6px 12px;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    box-shadow:0 7px 0 rgba(0,0,0,.10); transition:transform .1s;
  }
  .card:active { transform:scale(.93) translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.10); }
  .card .ico { font-size:clamp(40px,6.5vw,58px); line-height:1.1; }
  .card .nm { font-size:clamp(15px,2.4vw,20px); font-weight:800; }
  .card:nth-child(6n+1){ background:#ffe9e3; } .card:nth-child(6n+2){ background:#e3f4ff; }
  .card:nth-child(6n+3){ background:#fff6d6; } .card:nth-child(6n+4){ background:#e9ffe3; }
  .card:nth-child(6n+5){ background:#f3e8ff; } .card:nth-child(6n+0){ background:#ffe8f4; }

  /* ---------- 칭찬 오버레이 ---------- */
  #praise {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; background:rgba(255,255,255,.55); z-index:99; pointer-events:none;
  }
  #praise.on { display:flex; }
  #praise .big { font-size:clamp(80px,16vw,150px); animation:pop .5s; }
  #praise .txt { font-size:clamp(30px,6vw,54px); font-weight:900; color:#ff7b54; text-shadow:0 3px 0 #fff; animation:pop .5s; }
  @keyframes pop { 0%{transform:scale(.2)} 70%{transform:scale(1.2)} 100%{transform:scale(1)} }
  @keyframes wobble { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
  .wrong { animation:wobble .35s; }
  @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-12deg)} 75%{transform:rotate(12deg)} }
  .wig { animation:wiggle .4s; }

  /* ---------- 그림판 / 색칠 ---------- */
  .tools { display:flex; flex-wrap:wrap; gap:8px; padding:6px 12px; align-items:center; flex:0 0 auto; }
  .swatch {
    width:clamp(34px,5.2vw,48px); height:clamp(34px,5.2vw,48px); border-radius:50%;
    border:4px solid #fff; box-shadow:0 3px 0 rgba(0,0,0,.15); cursor:pointer; flex:0 0 auto;
  }
  .swatch.sel { border-color:#3a3a55; transform:scale(1.15); }
  .toolBtn {
    font-size:clamp(17px,3vw,25px); background:#fff; border:none; border-radius:16px;
    padding:8px 12px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.12); font-weight:700;
  }
  .toolBtn.sel { background:#ffe08a; box-shadow:0 4px 0 #d8b74f; }
  .canvasWrap { flex:1; position:relative; margin:0 12px 12px; min-height:0; }
  .canvasWrap canvas, .canvasWrap svg, .canvasWrap .under {
    position:absolute; inset:0; width:100%; height:100%;
    background:#fff; border-radius:22px; box-shadow:0 6px 0 rgba(0,0,0,.10); touch-action:none;
  }
  .canvasWrap svg { background:#f2fbff; }

  /* ---------- 필드형 게임 ---------- */
  .field { flex:1; position:relative; overflow:hidden; touch-action:none; }
  .floaty { position:absolute; cursor:pointer; user-select:none; line-height:1; }
  .bubbleBall {
    border-radius:50%;
    background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.95), rgba(173,225,255,.55) 45%, rgba(120,180,255,.35));
    border:2px solid rgba(255,255,255,.8); box-shadow:inset -6px -6px 12px rgba(90,140,220,.25);
  }
  .popped { transform:scale(1.8); opacity:0; transition:all .18s; }
  .water { background:linear-gradient(180deg,#8fd7ff 0%,#3f9fe0 100%); margin:0 12px 12px; border-radius:22px; }
  .sky { background:linear-gradient(180deg,#bfeaff 0%,#eafaff 100%); margin:0 12px 12px; border-radius:22px; }

  /* ---------- 두더지 ---------- */
  #moleGridBox {
    flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:14px; max-width:760px;
    width:100%; margin:0 auto; min-height:0;
  }
  .hole {
    background:#c9a36b; border-radius:26px; display:flex; align-items:flex-end; justify-content:center;
    overflow:hidden; box-shadow:inset 0 8px 12px rgba(0,0,0,.25); cursor:pointer;
  }
  .hole .mo { font-size:clamp(48px,8.5vw,84px); transform:translateY(110%); transition:transform .18s; line-height:1.05; }
  .hole.up .mo { transform:translateY(8%); }

  /* ---------- 짝 맞추기 ---------- */
  #memGridBox {
    flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:14px;
    max-width:820px; width:100%; margin:0 auto; min-height:0;
  }
  .mcard { perspective:600px; cursor:pointer; }
  .mcard .inner { position:relative; width:100%; height:100%; transition:transform .35s; transform-style:preserve-3d; }
  .mcard.open .inner { transform:rotateY(180deg); }
  .mface {
    position:absolute; inset:0; border-radius:18px; display:flex; align-items:center; justify-content:center;
    font-size:clamp(36px,6.5vw,66px); backface-visibility:hidden; box-shadow:0 5px 0 rgba(0,0,0,.12);
  }
  .mback { background:linear-gradient(135deg,#7fc8ff,#4a7bd8); color:#fff; }
  .mfront { background:#fff; transform:rotateY(180deg); }
  .mcard.done { visibility:hidden; }

  /* ---------- 퀴즈 공통 ---------- */
  .quizQ { text-align:center; font-size:clamp(21px,4vw,36px); font-weight:900; padding:6px 12px; flex:0 0 auto; }
  .quizStage {
    flex:1; display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:14px; padding:10px; align-content:center; position:relative; min-height:0;
  }
  .quizStage .item { font-size:clamp(46px,8vw,80px); line-height:1.15; }
  .quizAns { display:flex; gap:16px; justify-content:center; padding:0 12px 20px; flex:0 0 auto; flex-wrap:wrap; }
  .ansBtn {
    min-width:clamp(78px,13vw,124px); min-height:clamp(78px,13vw,124px);
    font-size:clamp(38px,6.5vw,60px); font-weight:900; border:none; border-radius:26px; background:#fff;
    box-shadow:0 7px 0 rgba(0,0,0,.13); cursor:pointer; transition:transform .08s;
    display:flex; align-items:center; justify-content:center; line-height:1.1;
  }
  .ansBtn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.13); }
  .colorDot { width:clamp(80px,13vw,124px); height:clamp(80px,13vw,124px); border-radius:50%;
    border:6px solid #fff; box-shadow:0 7px 0 rgba(0,0,0,.15); cursor:pointer; }
  .colorDot:active { transform:translateY(4px); }
  .sil { filter:brightness(0); opacity:.8; }
  .bigTop { text-align:center; font-size:clamp(70px,12vw,120px); padding:4px; flex:0 0 auto; line-height:1.1; }

  /* ---------- 글자/숫자 카드 ---------- */
  .letterGrid {
    flex:1; display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
    gap:12px; padding:14px; overflow-y:auto; align-content:start;
  }
  .letterCard {
    background:#fff; border:none; border-radius:20px; padding:12px 4px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; box-shadow:0 6px 0 rgba(0,0,0,.10);
  }
  .letterCard:active { transform:scale(.92); }
  .letterCard .ch { font-size:clamp(34px,5.5vw,50px); font-weight:900; color:#4a7bd8; line-height:1.1; }
  .letterCard .em { font-size:clamp(34px,5.5vw,52px); line-height:1.15; }
  .letterCard .wd { font-size:clamp(14px,2.2vw,18px); font-weight:800; }

  /* ---------- 음악 ---------- */
  .keysRow { flex:1; display:flex; gap:8px; padding:14px; align-items:stretch; min-height:0; }
  .key {
    flex:1; border:none; border-radius:0 0 22px 22px; background:#fff; cursor:pointer;
    box-shadow:0 8px 0 rgba(0,0,0,.15); display:flex; flex-direction:column;
    justify-content:flex-end; align-items:center; padding-bottom:14px; font-size:clamp(22px,3.6vw,36px);
    touch-action:none;
  }
  .key span { font-size:clamp(13px,1.9vw,17px); color:#8a8aa5; font-weight:800; }
  .key.hit { transform:translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.15); filter:brightness(1.12); }
  .xyloBox { flex:1; display:flex; flex-direction:column; gap:10px; padding:14px 24px; align-items:center; min-height:0; }
  .xbar {
    border:none; border-radius:16px; cursor:pointer; flex:1; width:100%;
    box-shadow:0 6px 0 rgba(0,0,0,.18); font-size:clamp(15px,2.4vw,20px); font-weight:900; color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.3); touch-action:none;
  }
  .xbar.hit { transform:translateY(4px); filter:brightness(1.2); }
  .drumBox { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:14px; min-height:0; }
  .pad {
    border:none; border-radius:26px; cursor:pointer; font-size:clamp(38px,6.5vw,64px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    box-shadow:0 8px 0 rgba(0,0,0,.15); touch-action:none;
  }
  .pad span { font-size:clamp(14px,2.2vw,19px); font-weight:900; color:#3a3a55; }
  .pad.hit { transform:translateY(5px) scale(.97); filter:brightness(1.1); }
  .simonBox { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px; max-width:640px; width:100%; margin:0 auto; min-height:0; }
  .spad { border:none; border-radius:30px; cursor:pointer; font-size:clamp(44px,8vw,80px);
    box-shadow:0 8px 0 rgba(0,0,0,.2); opacity:.72; touch-action:none; }
  .spad.lit { opacity:1; transform:scale(1.04); filter:brightness(1.25) saturate(1.3); }

  /* ---------- 경주/로켓/달걀 ---------- */
  .road {
    position:absolute; left:0; right:0; height:44%; background:#6d6d7a;
    border-top:6px dashed #fff; border-bottom:6px solid #4c4c58;
  }
  .carEl { position:absolute; font-size:clamp(44px,8vw,74px); transform:scaleX(-1); transition:left .12s linear; line-height:1; }
  .flagEl { position:absolute; font-size:clamp(40px,7vw,66px); }
  .tapHint { position:absolute; bottom:8px; left:0; right:0; text-align:center; color:#fff;
    font-size:clamp(17px,3vw,26px); font-weight:900; text-shadow:0 2px 3px rgba(0,0,0,.4); pointer-events:none; }
  .rocketStage { flex:1; position:relative; background:linear-gradient(180deg,#20264d 0%,#3a4a8a 70%,#7a6a5a 100%);
    margin:0 12px 12px; border-radius:22px; overflow:hidden; touch-action:none; }
  #rocketEl { position:absolute; left:50%; bottom:10%; transform:translateX(-50%);
    font-size:clamp(90px,16vw,150px); transition:transform 1.6s ease-in; line-height:1; }
  #rocketCnt { position:absolute; top:6%; left:0; right:0; text-align:center; color:#fff;
    font-size:clamp(60px,11vw,110px); font-weight:900; text-shadow:0 3px 0 rgba(0,0,0,.3); }
  .eggRow { flex:1; display:flex; align-items:center; justify-content:center; gap:5vw; flex-wrap:wrap; padding:10px; }
  .eggBtn { background:none; border:none; font-size:clamp(80px,15vw,150px); cursor:pointer; line-height:1.1; }

  /* ---------- 얼굴/아이스크림 ---------- */
  .faceStage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; min-height:0; }
  .faceStage .hatL { font-size:clamp(56px,9vw,96px); min-height:1.1em; }
  .faceStage .faceL { font-size:clamp(120px,22vw,220px); cursor:pointer; }
  .faceStage .neckL { font-size:clamp(50px,8vw,86px); min-height:1.1em; }
  .btnRow { display:flex; gap:12px; justify-content:center; padding:0 12px 18px; flex-wrap:wrap; flex:0 0 auto; }
  .iceStage { flex:1; display:flex; flex-direction:column-reverse; align-items:center; justify-content:flex-start; padding-bottom:8px; min-height:0; overflow:hidden; }
  .cone { width:0; height:0; border-left:52px solid transparent; border-right:52px solid transparent; border-top:120px solid #d9a05b; }
  .scoop { width:118px; height:96px; border-radius:50% 50% 45% 45%; margin-bottom:-26px; position:relative;
    box-shadow:inset -8px -10px 14px rgba(0,0,0,.12); animation:pop .3s; }
  .scoop .tp { position:absolute; font-size:26px; }

  /* ---------- 퍼즐 ---------- */
  .pzBoard { flex:1; display:flex; align-items:center; justify-content:center; padding:8px; min-height:0; }
  .pzGrid { display:grid; gap:4px; background:#fff; border-radius:18px; padding:6px;
    box-shadow:0 6px 0 rgba(0,0,0,.12); }
  .pzTile { background-repeat:no-repeat; border-radius:8px; cursor:pointer; }
  .pzTile.selTile { outline:5px solid #ff7b54; transform:scale(1.06); z-index:2; }

  /* ---------- 태블릿(넓은 화면) 최적화 ---------- */
  @media (min-width:900px){
    .menu { max-width:1240px; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:18px; }
    .card { padding:22px 8px 16px; border-radius:28px; }
    .card .ico { font-size:66px; }
    .card .nm { font-size:22px; }
    .letterGrid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px; }
    #memGridBox { max-width:1000px; }
    #moleGridBox { max-width:900px; }
    .quizStage .item { font-size:92px; }
    .ansBtn { min-width:140px; min-height:140px; font-size:66px; }
    .colorDot { width:140px; height:140px; }
    .simonBox { max-width:760px; }
    .cone { border-left-width:64px; border-right-width:64px; border-top-width:150px; }
    .scoop { width:146px; height:118px; margin-bottom:-32px; }
  }
</style>
</head>
<body>

<div id="praise"><div class="big">🎉</div><div class="txt">잘했어요!</div></div>

<section id="home" class="screen on">
  <div class="title">
    <h1>🧸 아이 놀이터 🧸</h1>
    <p>하고 싶은 놀이를 눌러 보세요! (44가지)</p>
    <button id="fsBtn" class="toolBtn" style="margin-top:10px">⛶ 전체화면</button>
    <button id="bgmBtn" class="toolBtn" style="margin-top:10px">🎵 배경음악 켜기</button>
  </div>
  <div class="menu" id="menu"></div>
</section>

<script>
"use strict";
/* ================================================================
   공통 유틸
================================================================ */
const $ = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>[...p.querySelectorAll(s)];
const rand = n=>Math.floor(Math.random()*n);
const shuffle = a=>{ for(let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

/* ---- 소리 ---- */
let AC=null, noiseBuf=null;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==="suspended")AC.resume(); return AC; }
function tone(freq,dur=0.15,type="sine",vol=0.25,when=0){
  try{
    const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,ctx.currentTime+when);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+when+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime+when); o.stop(ctx.currentTime+when+dur+0.05);
  }catch(e){}
}
function noiseHit(dur=0.15,vol=0.25,hp=0){
  try{
    const ctx=ac();
    if(!noiseBuf){ noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; }
    const s=ctx.createBufferSource(); s.buffer=noiseBuf;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    let node=s;
    if(hp){ const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp; s.connect(f); node=f; }
    node.connect(g); g.connect(ctx.destination); s.start(); s.stop(ctx.currentTime+dur+0.05);
  }catch(e){}
}
function kick(){
  try{
    const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.setValueAtTime(150,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(45,ctx.currentTime+0.25);
    g.gain.setValueAtTime(0.55,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.35);
  }catch(e){}
}
/* ---- 예쁜 종소리 & 동요 멜로디 ---- */
const NOTE_HZ={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,C5:523.25,D5:587.33,E5:659.25};
const SCALE10=[NOTE_HZ.C4,NOTE_HZ.D4,NOTE_HZ.E4,NOTE_HZ.F4,NOTE_HZ.G4,NOTE_HZ.A4,NOTE_HZ.B4,NOTE_HZ.C5,NOTE_HZ.D5,NOTE_HZ.E5];
function bell(f,dur=0.5,vol=0.25,when=0){
  tone(f,dur,"sine",vol,when);
  tone(f*2,dur*0.6,"sine",vol*0.35,when);
  tone(f*3,dur*0.35,"sine",vol*0.12,when);
}
const MELODIES=[
  ["E4","D4","C4","D4","E4","E4","E4","D4","D4","D4","E4","G4","G4"],
  ["G4","G4","A4","A4","G4","G4","E4","G4","G4","E4","E4","D4"],
  ["C4","C4","G4","G4","A4","A4","G4"],
  ["G4","E4","E4","F4","D4","D4","C4","D4","E4","F4","G4","G4","G4"],
  ["C4","D4","E4","F4","G4","A4","G4"],
  ["C4","C4","C4","E4","G4","G4","E4","C4"]
];
function playMelody(idx){
  const mel=MELODIES[idx==null?rand(MELODIES.length):idx];
  mel.forEach((n,i)=>bell(NOTE_HZ[n],0.32,0.26,i*0.17));
}

(function(){

  // [음, 박자] — 반짝반짝 / 비행기 / 나비야 / 학교종 / 곰 세 마리
  const SONGS=[
    [["C4",1],["C4",1],["G4",1],["G4",1],["A4",1],["A4",1],["G4",2],
     ["F4",1],["F4",1],["E4",1],["E4",1],["D4",1],["D4",1],["C4",2],
     ["G4",1],["G4",1],["F4",1],["F4",1],["E4",1],["E4",1],["D4",2],
     ["G4",1],["G4",1],["F4",1],["F4",1],["E4",1],["E4",1],["D4",2],
     ["C4",1],["C4",1],["G4",1],["G4",1],["A4",1],["A4",1],["G4",2],
     ["F4",1],["F4",1],["E4",1],["E4",1],["D4",1],["D4",1],["C4",2]],
    [["E4",1],["D4",1],["C4",1],["D4",1],["E4",1],["E4",1],["E4",2],
     ["D4",1],["D4",1],["D4",2],["E4",1],["G4",1],["G4",2],
     ["E4",1],["D4",1],["C4",1],["D4",1],["E4",1],["E4",1],["E4",2],
     ["D4",1],["D4",1],["E4",1],["D4",1],["C4",3]],
    [["G4",1],["E4",1],["E4",2],["F4",1],["D4",1],["D4",2],
     ["C4",1],["D4",1],["E4",1],["F4",1],["G4",1],["G4",1],["G4",2],
     ["G4",1],["E4",1],["E4",1],["E4",1],["F4",1],["D4",1],["D4",1],["D4",1],
     ["C4",1],["E4",1],["G4",1],["G4",1],["E4",1],["E4",1],["E4",3]],
    [["G4",1],["G4",1],["A4",1],["A4",1],["G4",1],["G4",1],["E4",2],
     ["G4",1],["G4",1],["E4",1],["E4",1],["D4",3],
     ["G4",1],["G4",1],["A4",1],["A4",1],["G4",1],["G4",1],["E4",2],
     ["G4",1],["E4",1],["D4",1],["E4",1],["C4",3]],
    [["C4",2],["C4",1],["C4",1],["C4",1],["C4",1],["E4",1],["G4",1],["G4",1],["E4",1],["C4",2],
     ["E4",1],["E4",1],["E4",2],["E4",1],["E4",1],["G4",1],["G4",1],["E4",1],["C4",3]]
  ];
  const BEAT=320; // ms
  let on=false, t=null, order=[], si=0, queue=[], qi=0;
  function nextSong(){
    if(!order.length||si>=order.length){ order=shuffle([0,1,2,3,4]); si=0; }
    queue=SONGS[order[si++]].concat([[R,4]]); // 곡 사이 쉼
    qi=0;
  }
  function step(){
    if(!on)return;
    if(qi>=queue.length)nextSong();
    const [n,beats]=queue[qi++];
    if(n){
      const f=NOTE_HZ[n];
      tone(f,beats*BEAT/1000*0.9,"sine",0.05);
      tone(f*2,beats*BEAT/1000*0.55,"sine",0.017);
      tone(f*4,beats*BEAT/1000*0.3,"sine",0.006);
    }
    t=setTimeout(step,beats*BEAT);
  }
  b.addEventListener("click",()=>{
    ac();
    on=!on;
    if(on){
      b.textContent="🔇 배경음악 끄기";
      order=[]; nextSong(); step();
    }else{
      b.textContent="🎵 배경음악 켜기";
      clearTimeout(t);
    }
  });
})();

(function(){
  const body=makeScreen("draw","🎨","그림 그리기","만들기 놀이");
  const pal=el("div","tools"), tools=el("div","tools"), wrap=el("div","canvasWrap");
  const canvas=document.createElement("canvas"); wrap.appendChild(canvas);
  body.append(pal,tools,wrap);
  const ctx=canvas.getContext("2d");
  const STAMPS=["🐥","🐶","🐱","⭐","🌸","🚗","❤️","🦋","🍎","🌈"];
  const SIZES=[6,14,28];
  let color=PAINT_COLORS[0], mode="pen", sizeIdx=1, hue=0, stampIdx=0;
  let drawing=false, last=null, snap=null;

  PAINT_COLORS.forEach((c,i)=>{
    const d=el("div","swatch"+(i===0?" sel":""));
    d.style.background=c; if(c==="#ffffff")d.style.borderColor="#ddd";
    onTap(d,()=>{
      color=c; if(mode!=="stamp")setMode("pen");
      $$(".swatch",pal).forEach(s=>s.classList.remove("sel")); d.classList.add("sel");
      tone(520,0.06,"triangle",0.15);
    });
    pal.appendChild(d);
  });
  const bPen=el("button","toolBtn sel","🖍️ 크레용"), bRain=el("button","toolBtn","🌈 무지개펜"),
        bStamp=el("button","toolBtn","🐥 도장"), bErase=el("button","toolBtn","🧽 지우개"),
        bSize=el("button","toolBtn","⚫ 굵기"), bClear=el("button","toolBtn","🗑️ 다 지우기");
  tools.append(bPen,bRain,bStamp,bErase,bSize,bClear);
  function setMode(m){
    mode=m;
    [[bPen,"pen"],[bRain,"rainbow"],[bStamp,"stamp"],[bErase,"eraser"]]
      .forEach(([bt,mm])=>bt.classList.toggle("sel",mm===m));
  }
  onTap(bPen,()=>{ setMode("pen"); tone(520,0.06); });
  onTap(bRain,()=>{ setMode("rainbow"); tone(620,0.06); });
  onTap(bErase,()=>{ setMode("eraser"); tone(420,0.06); });
  onTap(bStamp,()=>{
    if(mode==="stamp")stampIdx=(stampIdx+1)%STAMPS.length;
    setMode("stamp"); bStamp.textContent=STAMPS[stampIdx]+" 도장"; tone(720,0.06);
  });
  onTap(bSize,()=>{
    sizeIdx=(sizeIdx+1)%SIZES.length;
    bSize.textContent=["🔸 가늘게","⚫ 굵기","🟣 굵게"][sizeIdx]; tone(560,0.06);
  });
  onTap(bClear,()=>{ ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height); tone(300,0.15,"sawtooth",0.1); });

  function resize(){
    if(canvas.width>0){ try{ snap=ctx.getImageData(0,0,canvas.width,canvas.height); }catch(e){ snap=null; } }
    const r=wrap.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.floor(r.width*dpr)); canvas.height=Math.max(1,Math.floor(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,r.width,r.height);
    ctx.lineCap="round"; ctx.lineJoin="round";
    if(snap){ try{ ctx.putImageData(snap,0,0); }catch(e){} }
  }
  starts.draw=()=>requestAnimationFrame(resize);
  window.addEventListener("resize",()=>{ if(current==="draw")resize(); });

  const pos=e=>{ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  function stroke(){
    if(mode==="eraser"){ ctx.strokeStyle="#fff"; ctx.lineWidth=SIZES[sizeIdx]*2.2; }
    else if(mode==="rainbow"){ hue=(hue+4)%360; ctx.strokeStyle="hsl("+hue+",90%,55%)"; ctx.lineWidth=SIZES[sizeIdx]; }
    else { ctx.strokeStyle=color; ctx.lineWidth=SIZES[sizeIdx]; }
  }
  canvas.addEventListener("pointerdown",e=>{
    e.preventDefault(); ac(); canvas.setPointerCapture(e.pointerId);
    const p=pos(e);
    if(mode==="stamp"){
      ctx.font=(SIZES[sizeIdx]*3+26)+"px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(STAMPS[stampIdx],p.x,p.y);
      tone(700+rand(300),0.08,"triangle",0.18); return;
    }
    drawing=true; last=p;
    ctx.beginPath(); stroke(); ctx.fillStyle=ctx.strokeStyle;
    ctx.arc(p.x,p.y,ctx.lineWidth/2,0,Math.PI*2); ctx.fill();
  });
  canvas.addEventListener("pointermove",e=>{
    if(!drawing)return; e.preventDefault();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{
      const p=pos(ev);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); stroke(); ctx.stroke();
      last=p;
    });
  });
  ["pointerup","pointercancel","pointerleave"].forEach(t=>canvas.addEventListener(t,()=>{drawing=false;last=null;}));
})();

(function(){

  const THINGS=[["🦖","공룡"],["🚂","기차"],["🍉","수박"],["🐳","고래"],["🌻","해바라기"],["🚁","헬리콥터"],["🦋","나비"],["🍰","케이크"],["⛄","눈사람"],["🦒","기린"]];
  const PKEY="kidsWipePhotos";
  let photos=[], persisted=false;
  try{ const sv=JSON.parse(localStorage.getItem(PKEY)||"[]"); if(Array.isArray(sv)){ photos=sv; persisted=sv.length>0; } }catch(e){}
  function savePhotos(){
    try{ localStorage.setItem(PKEY,JSON.stringify(photos)); persisted=true; }
    catch(e){ persisted=false; }
  }
  let cur=null, done=false, box={x:0,y:0,s:100};

  const fileIn=document.createElement("input");
  fileIn.type="file"; fileIn.accept="image/*"; fileIn.multiple=true; fileIn.style.display="none";
  const bPhoto=el("button","toolBtn","📷 우리 캐릭터 넣기");
  bPhoto.addEventListener("click",()=>{ ac(); fileIn.click(); });
  const bNew=el("button","toolBtn","🔄 다시 숨기");
  onTap(bNew,()=>{ tone(500,0.08); round(); });
  tools.append(bPhoto,bNew,fileIn);
  fileIn.addEventListener("change",()=>{
    const fl=[...(fileIn.files||[])];
    if(!fl.length)return;
    let loaded=0;
    fl.forEach(f=>{
      const rd=new FileReader();
      rd.onload=()=>{
        const im=new Image();
        im.onload=()=>{
          const c=document.createElement("canvas"); c.width=400; c.height=400;
          const x=c.getContext("2d");
          if(x){
            const s=Math.min(im.width,im.height);
            x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,400,400);
            photos.push(c.toDataURL("image/jpeg",0.85));
          }
          if(++loaded===fl.length){
            savePhotos(); renderStrip();
            speak("우리 캐릭터 "+fl.length+"개가 숨을 준비를 했어요!");
            round(true);
          }
        };
        im.onerror=()=>{ if(++loaded===fl.length){ renderStrip(); round(true); } };
        im.src=rd.result;
      };
      rd.readAsDataURL(f);
    });
    fileIn.value="";
  });

  /* 등록된 캐릭터 갤러리 */
  const stripWrap=el("div");

  function renderStrip(){

      ? "등록된 우리 캐릭터 "+photos.length+"개 · "+(persisted?"이 기기에 저장됨 ✅":"저장 안 됨(앱을 닫으면 사라져요)")+" · 사진을 누르면 바로 숨어요"
      : "아직 등록된 캐릭터가 없어요. 📷 버튼으로 넣어 보세요! (여러 장 한번에 가능)";
    photos.forEach((url,i)=>{
      const t=el("div");
      t.style.cssText="position:relative;flex:0 0 auto;";
      const im=document.createElement("img");
      im.src=url;
      im.style.cssText="width:58px;height:58px;object-fit:cover;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.15);display:block;";
      const del=el("div","","✖");
      del.style.cssText="position:absolute;top:-7px;right:-7px;width:23px;height:23px;border-radius:50%;background:#ff7b54;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.2);";
      im.addEventListener("click",()=>{ ac(); bell(880,0.2,0.2); round(true,url); });
      del.addEventListener("click",()=>{ ac(); tone(350,0.12,"sine",0.12); photos.splice(i,1); savePhotos(); renderStrip(); });
      t.append(im,del);
      strip.appendChild(t);
    });
  }
  renderStrip();

  function cover(){
    const r=wrap.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.floor(r.width*dpr); cv.height=Math.floor(r.height*dpr);
    cx.setTransform(dpr,0,0,dpr,0,0);
    cx.globalCompositeOperation="source-over";
    const g=cx.createLinearGradient(0,0,r.width,r.height);
    g.addColorStop(0,"#b6c3d8"); g.addColorStop(1,"#8fa2c0");
    cx.fillStyle=g; cx.fillRect(0,0,r.width,r.height);
    cx.fillStyle="rgba(255,255,255,.5)"; cx.font="26px sans-serif"; cx.textAlign="center";
    cx.fillText("여기를 문질문질~ 🧽", r.width/2, r.height/2);
    cx.globalCompositeOperation="destination-out";
  }
  function place(usePhoto){
    const W=wrap.clientWidth, H=wrap.clientHeight;
    const S=Math.max(90,Math.min(W,H)*0.4);
    box.s=S;
    box.x=10+rand(Math.max(1,Math.floor(W-S-20)));
    box.y=10+rand(Math.max(1,Math.floor(H-S-20)));
    charBox.style.left=box.x+"px"; charBox.style.top=box.y+"px";
    charBox.style.width=S+"px"; charBox.style.height=S+"px";

    if(usePhoto){
      const im=document.createElement("img");
      im.src=cur;
      im.style.cssText="width:100%;height:100%;object-fit:cover;border-radius:18px;box-shadow:0 4px 10px rgba(0,0,0,.25);pointer-events:none;";
      charBox.appendChild(im);
    }else{
      charBox.textContent=cur[0];
      charBox.style.fontSize=(S*0.85)+"px";
    }
  }
  function round(forcePhoto,url){
    done=false;
    word.textContent="";
    cv.style.transition="none"; cv.style.opacity="1";
    const usePhoto=!!(photos.length&&(forcePhoto||Math.random()<0.5));
    cur=usePhoto?(url||photos[rand(photos.length)]):THINGS[rand(THINGS.length)];
    charBox.dataset.photo=usePhoto?"1":"";
    requestAnimationFrame(()=>{ place(usePhoto); cover(); });
  }
  function charCleared(){
    try{
      const sx=cv.width/wrap.clientWidth, sy=cv.height/wrap.clientHeight;
      const x0=Math.max(0,Math.floor(box.x*sx)), y0=Math.max(0,Math.floor(box.y*sy));
      const w=Math.min(cv.width-x0,Math.ceil(box.s*sx)), h=Math.min(cv.height-y0,Math.ceil(box.s*sy));
      if(w<=0||h<=0)return 0;
      const d=cx.getImageData(x0,y0,w,h).data;
      let t=0,c=0;
      for(let i=3;i<d.length;i+=4*13){ t++; if(d[i]<40)c++; }
      return t?c/t:0;
    }catch(e){ return 0; }
  }
  function rub(e){
    const r=cv.getBoundingClientRect();
    cx.beginPath();
    cx.arc(e.clientX-r.left, e.clientY-r.top, 34, 0, Math.PI*2);
    cx.fill();
  }
  function checkWin(){
    if(done)return;
    if(charCleared()>0.93){
      done=true;
      const label=charBox.dataset.photo?"우리 캐릭터":cur[1];
      word.textContent=label+" 찾았다!";
      speak(label+"! 찾았다!");
      cv.style.transition="opacity .8s"; cv.style.opacity="0";
      praise();
      setTimeout(round,2600);
    }
  }
  cv.addEventListener("pointerdown",e=>{ e.preventDefault(); ac(); cv.setPointerCapture(e.pointerId); rub(e); noiseHit(0.05,0.05,1200); checkWin(); });
  cv.addEventListener("pointermove",e=>{
    if(!e.buttons)return; e.preventDefault();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(rub);
    if(Math.random()<0.25)checkWin();
  });
  cv.addEventListener("pointerup",checkWin);
  starts.wipe=()=>round();
  window.addEventListener("resize",()=>{ if(current==="wipe")round(); });
})();

function riserGame(id,icon,name,makeEl,unit){
  const body=makeScreen(id,icon,name,"신나는 게임",{count:unit});
  const field=el("div","field sky"); body.appendChild(field);
  let timer=null; const alive=new Set();
  function spawn(){
    const b=makeEl();
    b.classList.add("floaty");
    const size=b._size;
    b.style.left=rand(Math.max(40,field.clientWidth-size))+"px";
    b.style.top=field.clientHeight+"px";
    field.appendChild(b); alive.add(b);
    const speed=0.9+Math.random()*1.4;
    let y=field.clientHeight;
    const ph=Math.random()*6, amp=8+rand(16);
    (function step(){
      if(!alive.has(b))return;
      y-=speed; b.style.top=y+"px";
      b.style.transform="translateX("+(Math.sin(ph+y/40)*amp)+"px)";
      if(y<-140){ alive.delete(b); b.remove(); return; }
      b._raf=requestAnimationFrame(step);
    })();
    b.addEventListener("pointerdown",e=>{
      e.preventDefault(); ac();
      if(!alive.has(b))return;
      alive.delete(b); cancelAnimationFrame(b._raf);
      b.classList.add("popped"); if(b._popTxt)b.textContent=b._popTxt;
      popSound();
      if(addScore(id)%10===0)praise();
      setTimeout(()=>b.remove(),200);
    });
  }
  starts[id]=()=>{ resetScore(id); timer=setInterval(spawn,780); spawn(); spawn(); };
  stops[id]=()=>{ clearInterval(timer); alive.forEach(b=>{cancelAnimationFrame(b._raf); b.remove();}); alive.clear(); };
}

(function(){

  wrap.append(cv,hint); body.appendChild(wrap);
  const cx=cv.getContext("2d");
  let parts=[], rockets=[], stars=[], raf=null, hinted=false, tapCount=0, autoT=0, W=0, H=0;

  function resize(){
    const r=wrap.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.floor(r.width*dpr); cv.height=Math.floor(r.height*dpr);
    cx.setTransform(dpr,0,0,dpr,0,0);
    W=r.width; H=r.height;
    stars=[];
    for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+0.4,tw:Math.random()*6.28});
  }
  function boomSound(){ kick(); noiseHit(0.35,0.12,900); }
  function shimmerSound(){ [1046,1318,1568,2093].forEach((f,i)=>tone(f,0.35,"sine",0.07,i*0.05)); }
  function addP(x,y,vx,vy,hue,opt){
    parts.push(Object.assign({x,y,vx,vy,hue,life:1,decay:0.011+Math.random()*0.008,
      size:2+Math.random()*2.5,grav:0.045,glitter:false,crackle:false},opt||{}));
  }
  function explode(x,y,type,hue){
    if(hue==null)hue=rand(360);
    const n=34+rand(20);
    if(type==="ring"){
      for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, sp=3.4+Math.random()*0.4;
        addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,hue,{glitter:Math.random()<0.4}); }
    }else if(type==="heart"){
      for(let i=0;i<n;i++){ const t=i/n*Math.PI*2;
        const hx=16*Math.pow(Math.sin(t),3);
        const hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
        addP(x,y,hx*0.22,hy*0.22,330+rand(30),{decay:0.010,glitter:Math.random()<0.3}); }
    }else if(type==="star"){
      for(let i=0;i<20;i++){ const a=i/20*Math.PI*2, sp=(i%4===0)?4.6:2.2;
        addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,50+rand(20),{glitter:true}); }
    }else if(type==="double"){
      const h2=(hue+180)%360;
      for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*2;
        addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,hue); }
      for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=2.6+Math.random()*1.6;
        addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,h2,{glitter:Math.random()<0.5}); }
    }else{
      for(let i=0;i<n+14;i++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*4.4;
        addP(x,y,Math.cos(a)*sp,Math.sin(a)*sp,hue+rand(40),{glitter:Math.random()<0.35,crackle:Math.random()<0.12}); }
    }
    boomSound(); shimmerSound();
  }
  const TYPES=["peony","ring","double","heart","star","peony","double"];
  function launch(x,ty,type){
    rockets.push({x,y:H+8,ty:Math.max(50,ty),vy:-(7+Math.random()*2.5),hue:rand(360),type});
    tone(1200,0.25,"sine",0.06); noiseHit(0.25,0.05,2500);
  }
  function finale(){
    for(let i=0;i<5;i++){
      setTimeout(()=>explode(40+Math.random()*(W-80),50+Math.random()*(H*0.5),TYPES[rand(TYPES.length)]),i*260);
    }
    playMelody();
  }
  function loop(){
    cx.globalCompositeOperation="source-over";
    cx.fillStyle="rgba(13,17,48,0.24)"; cx.fillRect(0,0,W,H);
    stars.forEach(s=>{
      s.tw+=0.05;
      cx.globalAlpha=0.35+Math.sin(s.tw)*0.3;
      cx.fillStyle="#fff";
      cx.beginPath(); cx.arc(s.x,s.y,s.r,0,Math.PI*2); cx.fill();
    });
    cx.globalAlpha=1;
    cx.globalCompositeOperation="lighter";
    rockets=rockets.filter(r=>r.y>r.ty);
    rockets.forEach(r=>{
      r.y+=r.vy;
      addP(r.x+(Math.random()*4-2),r.y,(Math.random()-0.5)*0.4,0.8+Math.random()*0.5,r.hue,{decay:0.05,size:1.6,grav:0.01});
      if(r.y<=r.ty)explode(r.x,r.ty,r.type,r.hue);
      cx.fillStyle="hsl("+r.hue+",90%,80%)";
      cx.beginPath(); cx.arc(r.x,r.y,3,0,Math.PI*2); cx.fill();
    });
    parts=parts.filter(p=>p.life>0);
    if(parts.length>900)parts.splice(0,parts.length-900);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.985; p.vy=p.vy*0.985+p.grav; p.life-=p.decay;
      if(p.crackle&&p.life<0.45){
        p.crackle=false;
        for(let i=0;i<5;i++){ const a=Math.random()*Math.PI*2;
          addP(p.x,p.y,Math.cos(a)*1.4,Math.sin(a)*1.4,p.hue,{decay:0.03,size:1.5}); }
      }
      const al=p.glitter?(Math.random()<0.5?p.life:p.life*0.2):p.life;
      cx.globalAlpha=Math.max(al,0);
      cx.fillStyle="hsl("+p.hue+",95%,"+(60+p.life*20)+"%)";
      cx.beginPath(); cx.arc(p.x,p.y,p.size,0,Math.PI*2); cx.fill();
    });
    cx.globalAlpha=1;
    if(++autoT>150){ autoT=0; launch(40+Math.random()*(W-80),60+Math.random()*(H*0.45),TYPES[rand(TYPES.length)]); }
    raf=requestAnimationFrame(loop);
  }
  cv.addEventListener("pointerdown",e=>{
    e.preventDefault(); ac();
    if(!hinted){ hint.style.display="none"; hinted=true; }
    const r=cv.getBoundingClientRect();
    launch(e.clientX-r.left,e.clientY-r.top,TYPES[rand(TYPES.length)]);
    tapCount++;
    if(tapCount%8===0)setTimeout(finale,600);
  });
  cv.addEventListener("pointermove",e=>{
    if(e.buttons&&Math.random()<0.22){
      const r=cv.getBoundingClientRect();
      explode(e.clientX-r.left,e.clientY-r.top,"peony");
    }
  });
  starts.firework=()=>{ requestAnimationFrame(()=>{ resize(); autoT=120; loop(); }); };
  stops.firework=()=>{ cancelAnimationFrame(raf); parts=[]; rockets=[]; };
  window.addEventListener("resize",()=>{ if(current==="firework")resize(); });
})();

  const PADS=[["#ff8a8a","🐶",330],["#8ad0ff","🐱",392],["#ffe58a","🐤",523],["#a8ef9c","🐸",659]];
  const btns=PADS.map(([bg,em,fq],i)=>{
    const b=el("button","spad",em); b.style.background=bg;
    b.addEventListener("pointerdown",e=>{ e.preventDefault(); ac(); input(i); });
    box.appendChild(b);
    return b;
  });
  let seq=[], idx=0, canTap=false, tids=[];
  function lit(i,d=380){
    btns[i].classList.add("lit");
    bell(PADS[i][2],0.4,0.3);
    tids.push(setTimeout(()=>btns[i].classList.remove("lit"),d));
  }
  function show(){
    canTap=false; idx=0;
    q.textContent="잘 보세요! ("+seq.length+"단계)";
    seq.forEach((v,k)=>tids.push(setTimeout(()=>lit(v),600+k*620)));
    tids.push(setTimeout(()=>{ canTap=true; q.textContent="이제 따라 눌러요!"; },600+seq.length*620));
  }
  function input(i){
    if(!canTap)return;
    lit(i,220);
    if(i===seq[idx]){
      idx++;
      if(idx===seq.length){
        canTap=false;
        if(seq.length>=5){ praise(); tids.push(setTimeout(newGame,1800)); }
        else { goodSound(); speak("딩동댕! 하나 더!"); seq.push(rand(4)); tids.push(setTimeout(show,1300)); }
      }
    }else{

      tids.push(setTimeout(show,1200));
    }

  function newGame(){ seq=[rand(4)]; show(); }
  starts.simon=newGame;

})();

/* ================================================================
   [똑똑] 34. 퍼즐 맞추기 (2x2/3x3/4x4 + 내 사진)
================================================================ */
(function(){
  const body=makeScreen("puzzle","🧩","퍼즐 맞추기","똑똑 놀이");
  const tools=el("div","tools"); tools.style.justifyContent="center";
  const boardBox=el("div","pzBoard");
  const grid=el("div","pzGrid");
  boardBox.appendChild(grid);
  body.append(tools,boardBox);

  function makeScene(draw){
    const c=document.createElement("canvas"); c.width=600; c.height=600;
    const x=c.getContext("2d");
    if(!x)return "";
    draw(x);
    return c.toDataURL("image/png");
  }
  function emo(x,ch,px,py,size){ x.font=size+"px serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(ch,px,py); }
  let IMGS=null;
  function ensureImgs(){
    if(IMGS)return;
    IMGS=[
      makeScene(x=>{
        const g=x.createLinearGradient(0,0,0,600); g.addColorStop(0,"#aee9ff"); g.addColorStop(1,"#d9f7c9");
        x.fillStyle=g; x.fillRect(0,0,600,600);
        emo(x,"☀️",90,90,120); emo(x,"🏠",300,320,300); emo(x,"🌳",510,380,190); emo(x,"🌷",115,510,110); emo(x,"🐶",470,530,110);
      }),
      makeScene(x=>{
        const g=x.createLinearGradient(0,0,0,600); g.addColorStop(0,"#8fd7ff"); g.addColorStop(1,"#2f7fc0");
        x.fillStyle=g; x.fillRect(0,0,600,600);
        emo(x,"🐠",180,180,180); emo(x,"🐙",440,330,190); emo(x,"🐢",160,470,140); emo(x,"🫧",320,90,90); emo(x,"🐚",500,545,90);
      }),
      makeScene(x=>{
        const g=x.createLinearGradient(0,0,0,600); g.addColorStop(0,"#1d2340"); g.addColorStop(1,"#3a4a8a");
        x.fillStyle=g; x.fillRect(0,0,600,600);
        emo(x,"🌙",110,100,130); emo(x,"🚀",320,320,260); emo(x,"⭐",500,140,90); emo(x,"⭐",120,320,70); emo(x,"🪐",500,480,130);
      })
    ];
    if(!imgURL)imgURL=IMGS[0];
  }
  let imgIdx=0, imgURL="", N=2, cells=[], selIdx=-1, busy=false;

  const sizeBtns=[["2×2",2],["3×3",3],["4×4",4]].map(([lb,n],i)=>{
    const b=el("button","toolBtn"+(i===0?" sel":""),lb);
    onTap(b,()=>{ N=n; sizeBtns.forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); tone(600,0.06); build(); });
    tools.appendChild(b); return b;
  });
  const bImg=el("button","toolBtn","🖼️ 그림 바꾸기");
  onTap(bImg,()=>{ ensureImgs(); imgIdx=(imgIdx+1)%IMGS.length; imgURL=IMGS[imgIdx]; tone(700,0.06); build(); });
  tools.appendChild(bImg);

  const fileIn=document.createElement("input");
  fileIn.type="file"; fileIn.accept="image/*"; fileIn.style.display="none";
  const bPhoto=el("button","toolBtn","📷 내 사진");
  bPhoto.addEventListener("click",()=>{ ac(); fileIn.click(); });
  tools.append(bPhoto,fileIn);
  fileIn.addEventListener("change",()=>{
    const f=fileIn.files&&fileIn.files[0];
    if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const c=document.createElement("canvas"); c.width=600; c.height=600;
        const x=c.getContext("2d");
        const s=Math.min(im.width,im.height);
        x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,600,600);
        imgURL=c.toDataURL("image/jpeg",0.85);
        speak("내 사진 퍼즐이에요!");
        build();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
    fileIn.value="";
  });

  function layout(){
    const side=Math.max(150,Math.min(boardBox.clientWidth,boardBox.clientHeight)-16);
    grid.style.width=side+"px"; grid.style.height=side+"px";
    grid.style.gridTemplateColumns="repeat("+N+",1fr)";
    grid.style.gridTemplateRows="repeat("+N+",1fr)";
  }
  function pieceStyle(d,k){
    const r=Math.floor(k/N), c=k%N;
    d.style.backgroundImage="url("+imgURL+")";
    d.style.backgroundSize=(N*100)+"% "+(N*100)+"%";
    d.style.backgroundPosition=(N>1?c/(N-1)*100:0)+"% "+(N>1?r/(N-1)*100:0)+"%";
  }
  function render(){ cells.forEach((k,i)=>pieceStyle(grid.children[i],k)); }
  function solved(){ return cells.every((k,i)=>k===i); }
  function build(){
    busy=false; selIdx=-1;
    grid.innerHTML=""; grid.style.gap="4px";
    const n2=N*N;
    cells=[...Array(n2).keys()];
    do{ shuffle(cells); }while(solved());
    for(let i=0;i<n2;i++){
      const d=el("div","pzTile");
      d.addEventListener("click",()=>{
        ac();
        if(busy)return;
        if(selIdx===-1){
          selIdx=i; d.classList.add("selTile"); tone(600,0.07,"triangle",0.15);
        }else if(selIdx===i){
          selIdx=-1; d.classList.remove("selTile"); tone(400,0.06,"triangle",0.12);
        }else{
          grid.children[selIdx].classList.remove("selTile");
          const t=cells[selIdx]; cells[selIdx]=cells[i]; cells[i]=t;
          selIdx=-1;
          popSound(); render();
          if(solved()){
            busy=true; grid.style.gap="0px";
            praise();
            setTimeout(()=>speak("퍼즐 완성! 대단해요!"),1400);
            setTimeout(build,3200);
          }
        }
      });
      grid.appendChild(d);
    }
    layout(); render();
  }
  starts.puzzle=()=>requestAnimationFrame(()=>{ ensureImgs(); build(); });
  window.addEventListener("resize",()=>{ if(current==="puzzle")layout(); });
})();

      setX();
      tone(500+rand(200),0.05,"triangle",0.12);
      if(x>track.clientWidth-90){
        done=true; clearTimeout(lt);
        speak("당근 냠냠! 도착!"); praise();
        setTimeout(start,2400);
      }
    }else{
      badSound();
      x=Math.max(8,x-30); setX();
    }
  });
  function start(){
    done=false; green=true; lamp.textContent="🟢"; x=8; setX();
    clearTimeout(lt); lt=setTimeout(flip,2200);
  }
  starts.light=start;
  stops.light=()=>clearTimeout(lt);
})();

/* ================================================================
   [게임] 37. 같은 색 풍선
================================================================ */
(function(){
  const body=makeScreen("colorpop","🎯","같은 색 풍선","신나는 게임",{score:true});
  const q=el("div","quizQ");
  const field=el("div","field sky");
  body.append(q,field);
  const CP=[["빨간색","#e74c3c"],["노란색","#f4d03f"],["초록색","#2ecc71"],["파란색","#3498db"],["보라색","#8e6bbf"],["분홍색","#ff7bac"]];
  let target=null, timer=null, hitCnt=0; const alive=new Set();
  function newTarget(){
    target=CP[rand(CP.length)]; hitCnt=0;
    q.innerHTML=target[0]+' 풍선만 터뜨려요! <span style="display:inline-block;width:26px;height:26px;border-radius:50%;vertical-align:-4px;background:'+target[1]+'"></span>';
    speak(target[0]+" 풍선만 터뜨려요");
  }
  function spawn(){
    const c=CP[rand(CP.length)];
    const b=el("div","floaty");
    const size=56+rand(30);
    b.style.cssText+="width:"+size+"px;height:"+(size*1.15)+"px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:"+c[1]+";box-shadow:inset -7px -9px 12px rgba(0,0,0,.18);";
    b.style.left=rand(Math.max(40,field.clientWidth-size))+"px";
    b.style.top=field.clientHeight+"px";
    field.appendChild(b); alive.add(b);
    const speed=0.9+Math.random()*1.2;
    let y=field.clientHeight;
    const ph=Math.random()*6, amp=8+rand(14);
    (function step(){
      if(!alive.has(b))return;
      y-=speed; b.style.top=y+"px";
      b.style.transform="translateX("+(Math.sin(ph+y/40)*amp)+"px)";
      if(y<-140){ alive.delete(b); b.remove(); return; }
      b._raf=requestAnimationFrame(step);
    })();
    b.addEventListener("pointerdown",e=>{
      e.preventDefault(); ac();
      if(!alive.has(b))return;
      if(c[0]===target[0]){
        alive.delete(b); cancelAnimationFrame(b._raf);
        b.classList.add("popped"); popSound();
        addScore("colorpop"); hitCnt++;
        setTimeout(()=>b.remove(),200);
        if(hitCnt>=5){ praise(); setTimeout(newTarget,1400); }
      }else{
        b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
        badSound(); speak("이건 "+c[0]+"이에요");
      }
    });
  }
  starts.colorpop=()=>{ resetScore("colorpop"); newTarget(); timer=setInterval(spawn,820); spawn(); spawn(); };
  stops.colorpop=()=>{ clearInterval(timer); alive.forEach(b=>{cancelAnimationFrame(b._raf); b.remove();}); alive.clear(); };
})();

(function(){
  const body=makeScreen("rps","✋","가위바위보","신나는 게임",{score:true});
  const q=el("div","quizQ","가위 바위 보!");

  body.append(q,top,stage);
  const H=[["✌️","가위"],["✊","바위"],["🖐️","보"]];
  let busy=false;
  H.forEach(([em,nm],i)=>{
    const b=el("button","ansBtn",em);
    onTap(b,()=>{
      if(busy)return; busy=true;
      speak("가위, 바위, 보!");
      let cnt=0;
      const roll=setInterval(()=>{
        top.textContent="🤖"+H[rand(3)][0];
        if(++cnt>7){ clearInterval(roll); judge(i); }
      },140);
    });
    stage.appendChild(b);
  });
  function judge(me){
    const cpu=rand(3);
    top.textContent="🤖"+H[cpu][0];
    const r=(me-cpu+3)%3;
    setTimeout(()=>{
      if(r===1){ addScore("rps"); q.textContent="이겼다! 🎉"; praise(); }
      else if(r===0){ q.textContent="비겼어요! 한 번 더!"; bell(660,0.3,0.2); speak("비겼어요! 한 번 더!"); }
      else { q.textContent="아이코, 졌어요! 다시!"; badSound(); speak("아이코! 다시 해봐요!"); }
      setTimeout(()=>{ q.textContent="가위 바위 보!"; top.textContent="🤖❔"; busy=false; },1700);
    },300);
  }
  starts.rps=()=>{ top.textContent="🤖❔"; q.textContent="가위 바위 보!"; busy=false; };
})();
